<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MUSH</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d0620; color: #fff2d0; font-family: monospace; }
  #wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100%; }
  #stage { position: relative; }
  #msg { margin: 12px; letter-spacing: 1px; }
  #foot { margin: 10px; font-size: 12px; opacity: .7; }
</style>
</head>
<body>
<div id="wrap">
  <div id="msg">LOADING MUSH... (the first load takes a little while)</div>
  <div id="stage"></div>
  <div id="foot">MUSH by Cnatt. Your saves are kept in this browser.</div>
</div>
<script src="https://cjrtnc.leaningtech.com/5.0/loader.js"></script>
<script>
(async function () {
  try {
    // "/app/" is the root of the website, so add the folder this page lives in (GitHub project sites live in /REPO-NAME/)
    const base = location.pathname.replace(/[^\/]*$/, "");
    await cheerpjInit({ javaProperties: ["mush.savedir=/files/", "mush.assets=/app" + base] });
    const stage = document.getElementById("stage");
    // the game is 1470x956; shrink the display if the browser window is smaller
    const sc = Math.min(1, window.innerWidth / 1470, (window.innerHeight - 70) / 956);
    cheerpjCreateDisplay(Math.floor(1470 * sc), Math.floor(956 * sc), stage);
    document.getElementById("msg").textContent = "CLICK THE GAME ONCE TO TURN ON SOUND";
    await cheerpjRunMain("Mush.WebMain", "/app" + base + "mush.jar");
  } catch (e) {
    document.getElementById("msg").textContent = "COULD NOT START: " + e;
  }
})();
</script>
</body>
</html>
